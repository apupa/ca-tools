project:
  type: website
  resources:
    - strumenti/**            # copia tutti gli strumenti nel sito generato
    - pillole/**               # copia le pillole teoriche (pagine + markdown + immagini)
  render:
    - "*.qmd"                 # renderizza SOLO i .qmd, non gli .html degli strumenti

website:
  title: "Controlli Automatici"
  search: false
  page-footer:
    border: true
    left: "© 2025 Andrea Pupa"
    right: "Corso di Controlli Automatici"

format:
  html:
    theme:
      - darkly
    css: styles.css
    toc: true
    anchor-sections: false   # niente icona-link automatica accanto ai titoli
