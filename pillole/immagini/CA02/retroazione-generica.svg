<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 27 540 164" fill="none">
  <defs>
    <marker id="punta-ca02" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--colore-testo, #1a1a17)" />
    </marker>
  </defs>

  <g stroke="var(--colore-testo, #1a1a17)" stroke-width="1.4">
    <!-- catena diretta -->
    <path d="M40 70 H143" marker-end="url(#punta-ca02)" />
    <path d="M167 70 H215" marker-end="url(#punta-ca02)" />
    <path d="M345 70 H560" marker-end="url(#punta-ca02)" />

    <!-- ramo di retroazione: scende dal punto di diramazione, torna
         indietro attraverso G2 e rientra nel nodo sommatore -->
    <path d="M470 70 V160 H408" marker-end="url(#punta-ca02)" />
    <path d="M280 160 H155 V85" marker-end="url(#punta-ca02)" />
  </g>

  <!-- punto di diramazione -->
  <circle cx="470" cy="70" r="3.4" fill="var(--colore-testo, #1a1a17)" />

  <!-- nodo sommatore -->
  <circle cx="155" cy="70" r="12" fill="var(--colore-foglio, #fbf9f5)"
          stroke="var(--colore-testo, #1a1a17)" stroke-width="1.4" />

  <!-- blocchi -->
  <g fill="var(--colore-foglio, #fbf9f5)"
     stroke="var(--colore-testo, #1a1a17)" stroke-width="1.6">
    <rect x="215" y="48" width="130" height="44" />
    <rect x="280" y="138" width="130" height="44" />
  </g>

  <g font-family="var(--font-serif, Georgia, serif)" font-size="18"
     fill="var(--colore-testo, #1a1a17)" text-anchor="middle">
    <text x="280" y="76"><tspan font-style="italic">G</tspan><tspan font-size="12" dy="5">1</tspan><tspan dy="-5" font-style="italic">(s)</tspan></text>
    <text x="345" y="166"><tspan font-style="italic">G</tspan><tspan font-size="12" dy="5">2</tspan><tspan dy="-5" font-style="italic">(s)</tspan></text>
  </g>

  <!-- segnali -->
  <g font-family="var(--font-serif, Georgia, serif)" font-size="18"
     font-style="italic" fill="var(--colore-testo, #1a1a17)">
    <text x="40" y="56">U(s)</text>
    <text x="520" y="56">Y(s)</text>
  </g>

  <!-- segni del sommatore -->
  <g font-family="var(--font-mono, monospace)" font-size="13"
     fill="var(--colore-muted, #7d7a70)">
    <text x="132" y="60">+</text>
    <text x="163" y="99">&#8722;</text>
  </g>
</svg>
